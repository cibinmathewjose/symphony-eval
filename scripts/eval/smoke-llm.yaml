version: 1
cases:
  - id: return-window
    question: How many days do I have to return an unopened item?
    passThreshold: 1.0
    expectedAnswer: You have 30 days to return an unopened sample product.
    rubric: |
      The answer must give a 30-day return window for an unopened item.
      Accept equivalent wording and extra correct detail, such as the receipt
      requirement. Treat a missing or contradictory deadline as a critical failure.
  - id: product-stock
    question: How many units of Hand Balm (SKU P63) are in stock?
    passThreshold: 1.0
    expectedAnswer: There are 12 units of Hand Balm (SKU P63) in stock.
    rubric: |
      The answer must clearly give 12 as the in-stock quantity for the requested
      product. Accept equivalent wording, a concise answer, or a table; do not
      require the SKU to be repeated. A missing or conflicting quantity, or a
      quantity given for a different product, is a critical failure.